name: Deploy Infrastructure and Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: secure-cloud-cluster-v2
  TF_WORKING_DIR: infra/terraform
  AWS_ROLE_ARN: arn:aws:iam::797776210271:role/SecureCloudGitHubActionsRole
  TF_STATE_BUCKET: secure-cloud-microservices-tfstate-797776210271
  TF_STATE_LOCK_TABLE: secure-cloud-tf-locks

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap State Backend & Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" 2>/dev/null || true
          aws dynamodb create-table --table-name "$TF_STATE_LOCK_TABLE" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region "$AWS_REGION" 2>/dev/null || true
          terraform init -input=false -reconfigure

      - name: Apply Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve

  kubernetes:
    name: Deploy Services
    needs: terraform
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR & Setup Tools
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Push & Deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          
          docker build -t $REGISTRY/securecloud/auth-service:$TAG services/auth-service
          docker build -t $REGISTRY/securecloud/resource-service:$TAG services/resource-service
          docker push $REGISTRY/securecloud/auth-service:$TAG
          docker push $REGISTRY/securecloud/resource-service:$TAG

          helm upgrade --install securecloud ./helm/securecloud \
            --namespace securecloud --create-namespace \
            --set authService.image="$REGISTRY/securecloud/auth-service:$TAG" \
            --set resourceService.image="$REGISTRY/securecloud/resource-service:$TAG"
