name: Deploy Infrastructure and Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: secure-cloud-cluster-v2
  TF_WORKING_DIR: infra/terraform
  AWS_ROLE_ARN: arn:aws:iam::797776210271:role/SecureCloudGitHubActionsRole
  TF_STATE_BUCKET: secure-cloud-microservices-tfstate-797776210271
  TF_STATE_LOCK_TABLE: secure-cloud-tf-locks

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap State Backend & Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          aws s3api create-bucket \
            --bucket "$TF_STATE_BUCKET" \
            --region "$AWS_REGION" 2>/dev/null || true

          aws dynamodb create-table \
            --table-name "$TF_STATE_LOCK_TABLE" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "$AWS_REGION" 2>/dev/null || true

          terraform init -input=false -reconfigure

      # ============================================================
      # TEMPORARY INSPECTION STAGE
      # ============================================================
      - name: Show Terraform State & AWS Resources
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=============================================="
          echo "TERRAFORM STATE"
          echo "=============================================="
          terraform state list || true

          echo ""
          echo "=============================================="
          echo "AWS IDENTITY"
          echo "=============================================="
          aws sts get-caller-identity

          echo ""
          echo "=============================================="
          echo "EKS CLUSTERS"
          echo "=============================================="
          aws eks list-clusters \
            --region "$AWS_REGION"

          echo ""
          echo "=============================================="
          echo "NAT GATEWAYS"
          echo "=============================================="
          aws ec2 describe-nat-gateways \
            --region "$AWS_REGION" \
            --filter Name=state,Values=pending,available \
            --query 'NatGateways[*].[NatGatewayId,State,SubnetId]' \
            --output table

          echo ""
          echo "=============================================="
          echo "ELASTIC IP ADDRESSES"
          echo "=============================================="
          aws ec2 describe-addresses \
            --region "$AWS_REGION" \
            --query 'Addresses[*].[AllocationId,PublicIp,AssociationId]' \
            --output table

          echo ""
          echo "=============================================="
          echo "ECR REPOSITORIES"
          echo "=============================================="
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --query 'repositories[*].repositoryName' \
            --output table

          echo ""
          echo "===================================

