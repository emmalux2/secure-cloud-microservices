name: Deploy Infrastructure and Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "helm/**"
      - "monitoring/**"
      - "services/**"
      - ".github/workflows/deploy.yml"

  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "helm/**"
      - "monitoring/**"
      - "services/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: secure-cloud-cluster-v2
  TF_WORKING_DIR: infra/terraform
  AWS_ROLE_ARN: arn:aws:iam::797776210271:role/SecureCloudGitHubActionsRole

concurrency:
  group: securecloud-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # TEMPORARY OIDC DEBUG
  # ============================================================
  oidc-debug:
    name: Debug GitHub OIDC Claims
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'pull_request' && 'plan' || 'production' }}

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Debug OIDC Token Claims
        uses: github/actions-oidc-debugger@main


  # ============================================================
  # TERRAFORM
  # ============================================================
  terraform:
    name: Terraform Plan & Apply

    needs:
      - oidc-debug

    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'pull_request' && 'plan' || 'production' }}

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # --------------------------------------------------------
      # Verify AWS Identity
      # --------------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -diff

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false -reconfigure

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false -no-color

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -input=false -auto-approve


  # ============================================================
  # KUBERNETES / EKS
  # ============================================================
  kubernetes:
    name: Deploy Services & Observability

    needs:
      - terraform

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # --------------------------------------------------------
      # Verify AWS Identity
      # --------------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Helm
      # --------------------------------------------------------
      - name: Setup Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Configure kubectl for EKS
      # --------------------------------------------------------
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # --------------------------------------------------------
      # Verify EKS
      # --------------------------------------------------------
      - name: Verify Cluster Access
        run: |
          kubectl get nodes

      # --------------------------------------------------------
      # Create ECR repositories
      # --------------------------------------------------------
      - name: Create ECR Repositories
        run: |
          aws ecr describe-repositories \
            --repository-names securecloud/auth-service \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name securecloud/auth-service

          aws ecr describe-repositories \
            --repository-names securecloud/resource-service \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name securecloud/resource-service

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build and Push Auth Service
      # --------------------------------------------------------
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/securecloud/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Build and Push Resource Service
      # --------------------------------------------------------
      - name: Build and Push Resource Service
        uses: docker/build-push-action@v6
        with:
          context: services/resource-service
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/securecloud/resource-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Deploy Application
      # --------------------------------------------------------
      - name: Deploy Application Chart
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install securecloud-release ./helm/securecloud \
            --namespace securecloud \
            --create-namespace \
            --set imagePullPolicy=Always \
            --set authService.image="$REGISTRY/securecloud/auth-service:$IMAGE_TAG" \
            --set resourceService.image="$REGISTRY/securecloud/resource-service:$IMAGE_TAG" \
            --wait \
            --timeout 10m

      # --------------------------------------------------------
      # Deploy Prometheus / Grafana
      # --------------------------------------------------------
      - name: Deploy Observability Stack
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts

          helm repo update

          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/kube-prometheus-stack-values.yaml \
            --wait \
            --timeout 10m

      # --------------------------------------------------------
      # Monitoring Resources
      # --------------------------------------------------------
      - name: Apply Monitoring Custom Resources
        run: |
          kubectl apply \
            -f monitoring/securecloud-servicemonitor.yaml

          kubectl apply \
            -f monitoring/securecloud-prometheusrule.yaml

      # --------------------------------------------------------
      # Verify Cluster
      # --------------------------------------------------------
      - name: Verify Rollouts & Cluster Health
        run: |
          kubectl rollout status deployment \
            --namespace securecloud \
            --timeout=5m

          kubectl get pods \
            --namespace monitoring