name: Deploy Infrastructure and Kubernetes

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "helm/**"
      - "monitoring/**"
      - "services/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "helm/**"
      - "monitoring/**"
      - "services/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: secure-cloud-cluster-v2
  TF_WORKING_DIR: infra/terraform
  AWS_ROLE_ARN: arn:aws:iam::797776210271:role/SecureCloudGitHubActionsRole

concurrency:
  group: securecloud-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'plan' || 'production' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via Direct STS Call
        run: |
          echo "=== 1. FETCHING OIDC TOKEN ==="
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$OIDC_TOKEN" > /tmp/web_identity_token

          echo "=== 2. DECODED TOKEN CLAIMS ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$OIDC_TOKEN"

          echo "=== 3. DIRECT AWS STS CALL ==="
          CREDENTIALS=$(aws sts assume-role-with-web-identity \
            --role-arn "${{ env.AWS_ROLE_ARN }}" \
            --role-session-name "gh-actions-session" \
            --web-identity-token file:///tmp/web_identity_token \
            --duration-seconds 3600 \
            --region "${{ env.AWS_REGION }}")

          echo "AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | jq -r '.Credentials.AccessKeyId')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | jq -r '.Credentials.SecretAccessKey')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDENTIALS | jq -r '.Credentials.SessionToken')" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -diff

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -reconfigure

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve

  kubernetes:
    name: Deploy Services & Observability
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via Direct STS Call
        run: |
          echo "=== 1. FETCHING OIDC TOKEN ==="
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$OIDC_TOKEN" > /tmp/web_identity_token

          echo "=== 2. DECODED TOKEN CLAIMS ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$OIDC_TOKEN"

          echo "=== 3. DIRECT AWS STS CALL ==="
          CREDENTIALS=$(aws sts assume-role-with-web-identity \
            --role-arn "${{ env.AWS_ROLE_ARN }}" \
            --role-session-name "gh-actions-session" \
            --web-identity-token file:///tmp/web_identity_token \
            --duration-seconds 3600 \
            --region "${{ env.AWS_REGION }}")

          echo "AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | jq -r '.Credentials.AccessKeyId')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | jq -r '.Credentials.SecretAccessKey')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDENTIALS | jq -r '.Credentials.SessionToken')" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Verify Cluster Access
        run: kubectl get nodes

      - name: Create ECR Repositories
        run: |
          aws ecr describe-repositories --repository-names securecloud/auth-service >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name securecloud/auth-service
          aws ecr describe-repositories --repository-names securecloud/resource-service >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name securecloud/resource-service

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/securecloud/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Resource Service
        uses: docker/build-push-action@v6
        with:
          context: services/resource-service
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/securecloud/resource-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Application Chart
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install securecloud-release ./helm/securecloud \
            --namespace securecloud \
            --create-namespace \
            --set imagePullPolicy=Always \
            --set authService.image="$REGISTRY/securecloud/auth-service:$IMAGE_TAG" \
            --set resourceService.image="$REGISTRY/securecloud/resource-service:$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Deploy Observability Stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/kube-prometheus-stack-values.yaml \
            --wait \
            --timeout 10m

      - name: Apply Monitoring Custom Resources
        run: |
          kubectl apply -f monitoring/securecloud-servicemonitor.yaml
          kubectl apply -f monitoring/securecloud-prometheusrule.yaml

      - name: Verify Rollouts & Cluster Health
        run: |
          kubectl rollout status deployment --namespace securecloud --timeout=5m
          kubectl get pods --namespace monitoring
