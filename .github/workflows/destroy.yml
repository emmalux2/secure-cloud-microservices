name: Destroy SecureCloud (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type DESTROY to remove EKS infrastructure and ECR images
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform

concurrency:
  group: securecloud-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # TERRAFORM
  # ============================================================
  terraform:
    name: Destroy infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require explicit destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "DESTROY" ]; then
            echo "Type DESTROY in the workflow input to continue."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -diff

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -reconfigure

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Remove application ECR repositories
        run: |
          for repo in securecloud/auth-service securecloud/resource-service; do
            if aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
              aws ecr delete-repository --repository-name "$repo" --force
            fi
          done
