name: CI Pipeline - OIDC Debug

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-debug:
    name: Debug GitHub OIDC Token
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get GitHub OIDC token and display claims
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "GitHub OIDC Debug Information"
          echo "========================================="

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Repository owner:"
          echo "${GITHUB_REPOSITORY_OWNER}"

          echo ""
          echo "Branch:"
          echo "${GITHUB_REF}"

          echo ""
          echo "Event:"
          echo "${GITHUB_EVENT_NAME}"

          echo ""
          echo "Requesting OIDC token..."

          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain OIDC token."
            exit 1
          fi

          echo "OIDC token successfully obtained."

          echo ""
          echo "========================================="
          echo "OIDC TOKEN CLAIMS"
          echo "========================================="

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          PAYLOAD=$(printf '%s' "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==";;
            3) PAYLOAD="${PAYLOAD}=";;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq .

          echo ""
          echo "========================================="
          echo "SUB CLAIM"
          echo "========================================="

          SUB=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.sub')

          echo "sub = ${SUB}"

          echo ""
          echo "========================================="
          echo "AUDIENCE CLAIM"
          echo "========================================="

          AUD=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.aud')

          echo "aud = ${AUD}"

          echo ""
          echo "========================================="
          echo "ISSUER CLAIM"
          echo "========================================="

          ISS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | jq -r '.iss')

          echo "iss = ${ISS}"

      - name: Test AWS OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity