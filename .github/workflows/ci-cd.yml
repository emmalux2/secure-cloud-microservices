name: SecureCloud CI/CD & Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/securecloud

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Application Security Testing (SAST) & Linting
  # -------------------------------------------------------------
  sast-and-lint:
    name: SAST & Repository Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Repository Vulnerability & Secret Scan (SAST)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # Job 2: Integration Testing via Docker Compose
  # -------------------------------------------------------------
  integration-test:
    name: Docker Compose Integration Test
    needs: sast-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create gateway directory if missing
        run: mkdir -p gateway

      - name: Launch Stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: sleep 15

      - name: Execute Automated Authentication & Gateway Tests
        run: |
          chmod +x test-auth-flow.sh
          ./test-auth-flow.sh

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------
  # Job 3: Build, Security Scan & Push to GHCR
  # -------------------------------------------------------------
  build-scan-and-push:
    name: Build, Scan & Push to GHCR
    needs: integration-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Auth Service ---
      - name: Build Auth Service Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}

      - name: Scan Auth Service Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails build if critical/high CVEs exist
          severity: 'CRITICAL,HIGH'

      - name: Push Auth Service to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:latest

      # --- Resource Service ---
      - name: Build Resource Service Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./services/resource-service
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-resource-service:${{ github.sha }}

      - name: Scan Resource Service Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-resource-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Push Resource Service to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-resource-service:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-resource-service:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-resource-service:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-resource-service:latest