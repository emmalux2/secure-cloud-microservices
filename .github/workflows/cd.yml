name: Continuous Delivery

on:
  push:
    branches: [ "main" ]

# Global permissions required to generate OIDC tokens for AWS authentication
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug OIDC Subject Claim
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event Name: ${{ github.event_name }}"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      - name: Deploy Microservices
        run: |
          echo "Executing Continuous Delivery tasks..."
          # Insert your docker push / helm / kubectl deploy commands here

      - name: Notify on Deploy Failure
        if: failure()
        env:
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py --event "DEPLOY_FAILURE" --repo "${{ github.repository }}" --run "${{ github.run_id }}"