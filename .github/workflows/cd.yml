name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # SETUP TERRAFORM
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ============================================================
      # SETUP PYTHON
      # ============================================================
      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # ============================================================
      # AUTHENTICATE WITH AWS USING OIDC
      # ============================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # ============================================================
      # VERIFY AWS AUTHENTICATION
      # ============================================================
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      # ============================================================
      # VERIFY BOTO3 CREDENTIALS
      # ============================================================
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY

      # ============================================================
      # CHECK TERRAFORM STATE BUCKET
      # ============================================================
      - name: Check Terraform State Bucket
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING TERRAFORM STATE BUCKET"
          echo "=========================================="

          BUCKET="secure-cloud-microservices-tfstate-797776210271"
          REGION="us-east-1"

          if aws s3api head-bucket \
            --bucket "$BUCKET" \
            --region "$REGION"; then

            echo "Terraform state bucket exists:"
            echo "$BUCKET"

          else

            echo "ERROR: Terraform state bucket does not exist:"
            echo "$BUCKET"
            exit 1

          fi

      # ============================================================
      # TERRAFORM INIT
      # ============================================================
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure

      # ============================================================
      # SYNCHRONIZE EXISTING JWT SECRET
      # ============================================================
      - name: Synchronize Existing JWT Secret
        working-directory: infra/terraform
        run: |
          set -e

          SECRET_NAME="secure-cloud/jwt-access-secret"

          echo "=========================================="
          echo "SYNCHRONIZING AWS SECRETS MANAGER"
          echo "=========================================="

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --region us-east-1 \
            --query 'ARN' \
            --output text 2>/dev/null || true)

          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then

            echo "Secret does not exist in AWS."
            echo "Terraform configuration should create it."

          else

            echo "Existing secret found:"
            echo "$SECRET_ARN"

            echo "Secret is configured as a Terraform data source."
            echo "No Terraform import is required."

          fi

      # ============================================================
      # SYNCHRONIZE EXISTING WAF
      # ============================================================
      - name: Synchronize Existing WAF
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING WAF"
          echo "=========================================="

          WAF_NAME="main-waf"
          WAF_SCOPE="REGIONAL"
          WAF_REGION="us-east-1"

          WAF_ID=$(aws wafv2 list-web-acls \
            --scope "$WAF_SCOPE" \
            --region "$WAF_REGION" \
            --query "WebACLs[?Name=='$WAF_NAME'].Id | [0]" \
            --output text)

          if [ -z "$WAF_ID" ] || [ "$WAF_ID" = "None" ]; then

            echo "WAF does not exist in AWS."
            echo "Terraform will create it."

          else

            echo "Existing WAF found:"
            echo "Name: $WAF_NAME"
            echo "ID: $WAF_ID"
            echo "Scope: $WAF_SCOPE"

            STATE_LIST=$(terraform state list 2>/dev/null || true)

            if echo "$STATE_LIST" | grep -q '^aws_wafv2_web_acl\.main$'; then

              echo "WAF is already managed by Terraform."

            else

              echo "WAF is NOT managed by Terraform."
              echo "Importing existing WAF..."

              WAF_IMPORT_ID="${WAF_ID}/${WAF_NAME}/${WAF_SCOPE}"

              echo "Terraform import ID:"
              echo "$WAF_IMPORT_ID"

              terraform import \
                -input=false \
                aws_wafv2_web_acl.main \
                "$WAF_IMPORT_ID"

              echo "WAF successfully imported."

            fi
          fi

      # ============================================================
      # SYNCHRONIZE WAF LOG GROUP
      # ============================================================
      - name: Synchronize WAF Log Group
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING WAF LOG GROUP"
          echo "=========================================="

          LOG_GROUP_NAME="aws-waf-logs-main"

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -q '^aws_cloudwatch_log_group\.waf_log_group$'; then

            echo "WAF log group is already managed by Terraform."

          elif aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP_NAME" \
            --region us-east-1 \
            --query "logGroups[?logGroupName=='$LOG_GROUP_NAME'].logGroupName" \
            --output text | grep -q "$LOG_GROUP_NAME"; then

            echo "Existing WAF log group found."
            echo "Importing..."

            terraform import \
              -input=false \
              aws_cloudwatch_log_group.waf_log_group \
              "$LOG_GROUP_NAME"

            echo "WAF log group successfully imported."

          else

            echo "WAF log group does not exist."
            echo "Terraform will create it."

          fi

      # ============================================================
      # SYNCHRONIZE EXISTING EKS CLOUDWATCH LOG GROUP
      # ============================================================
      - name: Synchronize EKS Cluster Log Group
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EKS CLUSTER LOG GROUP"
          echo "=========================================="

          LOG_GROUP_NAME="/aws/eks/secure-cloud-cluster/cluster"

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -q '^module\.eks\.aws_cloudwatch_log_group\.this\[0\]$'; then

            echo "EKS cluster log group is already managed by Terraform."

          elif aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP_NAME" \
            --region us-east-1 \
            --query "logGroups[?logGroupName=='$LOG_GROUP_NAME'].logGroupName" \
            --output text | grep -q "$LOG_GROUP_NAME"; then

            echo "Existing EKS cluster log group found:"
            echo "$LOG_GROUP_NAME"

            echo "Importing existing log group..."

            terraform import \
              -input=false \
              'module.eks.aws_cloudwatch_log_group.this[0]' \
              "$LOG_GROUP_NAME"

            echo "EKS cluster log group successfully imported."

          else

            echo "EKS cluster log group does not exist."
            echo "Terraform will create it."

          fi

      # ============================================================
      # SYNCHRONIZE EXISTING KMS ALIAS
      # ============================================================
      - name: Synchronize EKS KMS Alias
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EKS KMS ALIAS"
          echo "=========================================="

          ALIAS_NAME="alias/eks/secure-cloud-cluster"

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -q '^module\.eks\.module\.kms\.aws_kms_alias\.this\["cluster"\]$'; then

            echo "EKS KMS alias is already managed by Terraform."

          elif aws kms list-aliases \
            --region us-east-1 \
            --query "Aliases[?AliasName=='$ALIAS_NAME'].AliasName" \
            --output text | grep -q "$ALIAS_NAME"; then

            echo "Existing KMS alias found:"
            echo "$ALIAS_NAME"

            echo "Importing existing KMS alias..."

            terraform import \
              -input=false \
              'module.eks.module.kms.aws_kms_alias.this["cluster"]' \
              "$ALIAS_NAME"

            echo "EKS KMS alias successfully imported."

          else

            echo "KMS alias does not exist."
            echo "Terraform will create it."

          fi

      # ============================================================
      # TERRAFORM VALIDATE
      # ============================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate

      # ============================================================
      # TERRAFORM PLAN
      # ============================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # ============================================================
      # TERRAFORM APPLY
      # ============================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ============================================================
      # SEND EMAIL IF DEPLOYMENT FAILS
      # ============================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
