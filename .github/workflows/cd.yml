name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Check Terraform State Bucket
        run: |
          BUCKET="secure-cloud-microservices-tfstate-797776210271"
          REGION="us-east-1"
          aws s3api head-bucket --bucket "$BUCKET" --region "$REGION" || \
            (echo "ERROR: Terraform state bucket missing"; exit 1)

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -reconfigure

      - name: Synchronize Existing JWT Secret
        working-directory: infra/terraform
        run: |
          SECRET_NAME="secure-cloud/jwt-access-secret"
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --region us-east-1 \
            --query 'ARN' \
            --output text 2>/dev/null || true)

          if [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ]; then
            echo "JWT secret exists, using data source."
          else
            echo "JWT secret not found, Terraform will create it."
          fi

      - name: Synchronize Existing EKS Cluster
        working-directory: infra/terraform
        run: |
          CLUSTER_NAME="secure-cloud-cluster"
          TF_RESOURCE='module.eks.aws_eks_cluster.this[0]'

          if aws eks describe-cluster --name "$CLUSTER_NAME" --region us-east-1 >/dev/null 2>&1; then
            echo "Cluster exists in AWS."
            if ! terraform state list | grep -Fqx "$TF_RESOURCE"; then
              echo "Importing cluster into Terraform state..."
              terraform import -input=false "$TF_RESOURCE" "$CLUSTER_NAME" || true
            else
              echo "Cluster already managed in Terraform state."
            fi
          else
            echo "Cluster does not exist, Terraform will create it."
          fi

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan -detailed-exitcode || true

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: python alerts/notify.py --event "DEPLOY_FAILURE" --repo "${{ github.repository }}" --run "${{ github.run_id }}"
