name: Continuous Delivery

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # ==========================================================
      # AWS OIDC AUTHENTICATION
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # ==========================================================
      # VERIFY AWS OIDC
      # ==========================================================
      - name: Verify AWS Connection
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # ==========================================================
      # VERIFY AWS CREDENTIAL ENVIRONMENT
      # ==========================================================
      - name: Verify AWS Environment
        run: |
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "ERROR: AWS_ACCESS_KEY_ID is not available"
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: AWS_SECRET_ACCESS_KEY is not available"
            exit 1
          fi

          if [ -z "$AWS_SESSION_TOKEN" ]; then
            echo "ERROR: AWS_SESSION_TOKEN is not available"
            exit 1
          fi

          echo "Temporary AWS OIDC credentials detected."

      # ==========================================================
      # VERIFY BOTO3
      # ==========================================================
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY

      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================
      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure

      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform validate

      # ==========================================================
      # CHECK SECRETS MANAGER
      # ==========================================================
      - name: Check Existing JWT Secret
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Checking AWS Secrets Manager..."

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "secure-cloud/jwt-access-secret" \
            --query 'ARN' \
            --output text 2>/dev/null || true)

          if [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ]; then
            echo "Secret exists:"
            echo "$SECRET_ARN"
          else
            echo "Secret does not currently exist."
          fi

      # ==========================================================
      # TERRAFORM PLAN
      # ==========================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # ==========================================================
      # TERRAFORM APPLY
      # ==========================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ==========================================================
      # DEPLOYMENT FAILURE NOTIFICATION
      # ==========================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
