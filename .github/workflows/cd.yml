name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # SETUP TERRAFORM
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================================
      # SETUP PYTHON
      # ============================================================
      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3


      # ============================================================
      # AUTHENTICATE GITHUB ACTIONS WITH AWS USING OIDC
      # ============================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true


      # ============================================================
      # VERIFY AWS AUTHENTICATION
      # ============================================================
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity


      # ============================================================
      # VERIFY BOTO3 CREDENTIALS
      # ============================================================
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY


      # ============================================================
      # CHECK TERRAFORM STATE BUCKET
      # ============================================================
      - name: Check Terraform State Bucket
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING TERRAFORM STATE BUCKET"
          echo "=========================================="

          BUCKET="secure-cloud-microservices-tfstate-797776210271"
          REGION="us-east-1"

          if aws s3api head-bucket \
            --bucket "$BUCKET" \
            --region "$REGION"; then

            echo "Terraform state bucket exists:"
            echo "$BUCKET"

          else

            echo "ERROR: Terraform state bucket does not exist:"
            echo "$BUCKET"
            echo ""
            echo "Create this S3 bucket before Terraform can initialize."
            exit 1

          fi


      # ============================================================
      # TERRAFORM INITIALIZATION
      # ============================================================
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure


      # ============================================================
      # SYNCHRONIZE EXISTING JWT SECRET
      # ============================================================
      - name: Synchronize Existing JWT Secret
        working-directory: infra/terraform
        run: |
          set -e

          SECRET_NAME="secure-cloud/jwt-access-secret"

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING JWT SECRET"
          echo "=========================================="

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --region us-east-1 \
            --query 'ARN' \
            --output text 2>/dev/null || true)

          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then

            echo "JWT secret does not exist in AWS."
            echo "Terraform will handle the resource."

          else

            echo "Existing JWT secret found:"
            echo "$SECRET_ARN"

            echo "=========================================="
            echo "CHECKING TERRAFORM STATE"
            echo "=========================================="

            STATE_LIST=$(terraform state list 2>/dev/null || true)

            if echo "$STATE_LIST" | grep -Fqx 'aws_secretsmanager_secret.jwt_access'; then

              echo "JWT secret is already managed by Terraform."

            else

              echo "JWT secret is not managed by Terraform."

              # The current secrets.tf uses a DATA SOURCE:
              #
              # data "aws_secretsmanager_secret" "jwt_access"
              #
              # Therefore Terraform must NOT import this secret.
              # It is intentionally read from AWS instead.

              echo "JWT secret is configured as a data source."
              echo "No Terraform import is required."

            fi
          fi


      # ============================================================
      # SYNCHRONIZE EXISTING EKS CLUSTER
      #
      # IMPORTANT:
      # This step is AFTER Terraform Init
      # and BEFORE Terraform Validate.
      # ============================================================
      - name: Synchronize Existing EKS Cluster
        working-directory: infra/terraform
        run: |
          set -e

          CLUSTER_NAME="secure-cloud-cluster"
          REGION="us-east-1"

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING EKS CLUSTER"
          echo "=========================================="

          if aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" >/dev/null 2>&1; then

            echo "Existing EKS cluster found:"
            echo "$CLUSTER_NAME"

            echo "=========================================="
            echo "CHECKING TERRAFORM STATE"
            echo "=========================================="

            STATE_LIST=$(terraform state list 2>/dev/null || true)

            if echo "$STATE_LIST" | grep -Fqx 'module.eks.aws_eks_cluster.this[0]'; then

              echo "EKS cluster is already managed by Terraform."

            else

              echo "EKS cluster is NOT managed by Terraform."
              echo "Importing existing EKS cluster..."

              terraform import \
                -input=false \
                'module.eks.aws_eks_cluster.this[0]' \
                "$CLUSTER_NAME"

              echo "EKS cluster successfully imported."

            fi

          else

            echo "EKS cluster does not exist in AWS."
            echo "Terraform will create it."

          fi


      # ============================================================
      # TERRAFORM VALIDATE
      # ============================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate


      # ============================================================
      # TERRAFORM PLAN
      # ============================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # ============================================================
      # TERRAFORM APPLY
      # ============================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ============================================================
      # DEPLOYMENT FAILURE NOTIFICATION
      # ============================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
