name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # Verify AWS authentication
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      # Verify Boto3 credentials
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY

      # Terraform initialization
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false -reconfigure

      # Check and import existing Secrets Manager secret
      - name: Ensure JWT Secret Is In Terraform State
        working-directory: infra/terraform
        run: |
          set -e

          SECRET_NAME="secure-cloud/jwt-access-secret"

          echo "Checking AWS Secrets Manager..."

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query 'ARN' \
            --output text 2>/dev/null || true)

          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then
            echo "Secret does not exist in AWS."
            echo "Terraform will create it."
          else
            echo "Secret exists in AWS:"
            echo "$SECRET_ARN"

            echo "Checking Terraform state..."

            if terraform state list | grep -q '^aws_secretsmanager_secret\.jwt_access$'; then
              echo "Secret is already managed by Terraform."
            else
              echo "Secret is NOT in Terraform state."
              echo "Importing existing secret..."

              terraform import \
                -input=false \
                aws_secretsmanager_secret.jwt_access \
                "$SECRET_ARN"

              echo "Secret successfully imported."
            fi
          fi

      # Validate Terraform configuration
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate

      # Generate Terraform plan
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # Apply Terraform infrastructure
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # Send email if deployment fails
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
