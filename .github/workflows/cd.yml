name: Continuous Delivery

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure

      - name: Terraform Validate
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform validate

      - name: Import Existing JWT Secret
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Checking Terraform state for JWT secret..."

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then
            echo "JWT secret is already in Terraform state."
          else
            echo "JWT secret is NOT in Terraform state."

            SECRET_ARN=$(aws secretsmanager describe-secret \
              --secret-id "secure-cloud/jwt-access-secret" \
              --query "ARN" \
              --output text)

            echo "Existing secret ARN:"
            echo "$SECRET_ARN"

            echo "Importing existing secret into Terraform..."

            terraform import \
              -input=false \
              aws_secretsmanager_secret.jwt_access \
              "$SECRET_ARN"
          fi

      - name: Verify JWT Secret State
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Checking Terraform state..."

          terraform state list | grep -Fx \
            "aws_secretsmanager_secret.jwt_access"

      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
