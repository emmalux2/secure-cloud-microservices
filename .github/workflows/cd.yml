name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # Required for AWS OIDC authentication
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        run: |
          for svc in auth-service resource-service; do
            docker build -t ${{ secrets.ECR_REGISTRY }}/$svc:${{ github.sha }} services/$svc
            docker push ${{ secrets.ECR_REGISTRY }}/$svc:${{ github.sha }}
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=${{ github.sha }}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name secure-cloud-cluster --region us-east-1

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/auth-service auth-service=${{ secrets.ECR_REGISTRY }}/auth-service:${{ github.sha }} -n secure-cloud
          kubectl set image deployment/resource-service resource-service=${{ secrets.ECR_REGISTRY }}/resource-service:${{ github.sha }} -n secure-cloud
          kubectl rollout status deployment/auth-service -n secure-cloud
          kubectl rollout status deployment/resource-service -n secure-cloud

      - name: Notify on deploy failure
        if: failure()
        run: python alerts/notify.py --event "DEPLOY_FAILURE" --repo "${{ github.repository }}" --run "${{ github.run_id }}"
        env:
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
          AWS_REGION: us-east-1