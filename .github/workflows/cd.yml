name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # ============================================================
      # AWS OIDC AUTHENTICATION
      # ============================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # ============================================================
      # VERIFY AWS
      # ============================================================
      - name: Verify AWS Connection
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # ============================================================
      # TERRAFORM INIT
      # ============================================================
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure

      # ============================================================
      # CHECK EXISTING JWT SECRET
      # ============================================================
      - name: Ensure JWT Secret Is Managed By Terraform
        working-directory: infra/terraform
        shell: bash
        run: |
          set -e

          SECRET_NAME="secure-cloud/jwt-access-secret"

          echo "=========================================="
          echo "CHECKING AWS SECRETS MANAGER"
          echo "=========================================="

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query "ARN" \
            --output text 2>/dev/null || true)

          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then
            echo "Secret does not exist in AWS."
            echo "Terraform will create it."
            exit 0
          fi

          echo "Secret exists in AWS:"
          echo "$SECRET_ARN"

          echo ""
          echo "=========================================="
          echo "CHECKING TERRAFORM STATE DIRECTLY"
          echo "=========================================="

          if terraform state show aws_secretsmanager_secret.jwt_access >/dev/null 2>&1; then
            echo "SUCCESS: Secret is already managed by Terraform."
            echo ""
            terraform state show aws_secretsmanager_secret.jwt_access
            exit 0
          fi

          echo "Secret is NOT in Terraform state."
          echo "Importing existing AWS secret..."

          terraform import \
            -input=false \
            aws_secretsmanager_secret.jwt_access \
            "$SECRET_ARN"

          echo ""
          echo "=========================================="
          echo "VERIFYING IMPORT"
          echo "=========================================="

          terraform state show aws_secretsmanager_secret.jwt_access

          echo ""
          echo "SUCCESS: Secret has been imported into Terraform state."

      # ============================================================
      # VERIFY TERRAFORM STATE
      # ============================================================
      - name: Verify Terraform State
        working-directory: infra/terraform
        run: |
          echo "=========================================="
          echo "TERRAFORM STATE"
          echo "=========================================="

          terraform state show aws_secretsmanager_secret.jwt_access

      # ============================================================
      # VALIDATE
      # ============================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate

      # ============================================================
      # PLAN
      # ============================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # ============================================================
      # APPLY
      # ============================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ============================================================
      # FAILURE NOTIFICATION
      # ============================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
