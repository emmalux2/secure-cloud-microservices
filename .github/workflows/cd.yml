```yaml
name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # SETUP TERRAFORM
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================================
      # SETUP PYTHON
      # ============================================================
      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3


      # ============================================================
      # AUTHENTICATE GITHUB ACTIONS WITH AWS USING OIDC
      # ============================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true


      # ============================================================
      # VERIFY AWS AUTHENTICATION
      # ============================================================
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity


      # ============================================================
      # VERIFY BOTO3 CREDENTIALS
      # ============================================================
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY


      # ============================================================
      # CHECK TERRAFORM STATE BUCKET
      # ============================================================
      - name: Check Terraform State Bucket
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING TERRAFORM STATE BUCKET"
          echo "=========================================="

          BUCKET="secure-cloud-microservices-tfstate-797776210271"
          REGION="us-east-1"

          if aws s3api head-bucket \
            --bucket "$BUCKET" \
            --region "$REGION"; then

            echo "Terraform state bucket exists:"
            echo "$BUCKET"

          else

            echo "ERROR: Terraform state bucket does not exist:"
            echo "$BUCKET"
            echo ""
            echo "Create this S3 bucket before Terraform can initialize."
            exit 1

          fi


      # ============================================================
      # TERRAFORM INITIALIZATION
      # ============================================================
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure


      # ============================================================
      # SYNCHRONIZE EXISTING JWT SECRET
      # ============================================================
      - name: Synchronize Existing JWT Secret
        working-directory: infra/terraform
        run: |
          set -e

          SECRET_NAME="secure-cloud/jwt-access-secret"

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING JWT SECRET"
          echo "=========================================="

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --region us-east-1 \
            --query 'ARN' \
            --output text 2>/dev/null || true)

          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then

            echo "JWT secret does not exist in AWS."
            echo "Terraform configuration will handle this."

          else

            echo "Existing JWT secret found:"
            echo "$SECRET_ARN"

            echo ""
            echo "The current secrets.tf uses:"
            echo 'data "aws_secretsmanager_secret" "jwt_access"'

            echo ""
            echo "Therefore the JWT secret is READ from AWS"
            echo "as a data source and must NOT be imported."

          fi


      # ============================================================
      # SYNCHRONIZE EXISTING EKS CLUSTER
      #
      # IMPORTANT:
      # This step is AFTER Terraform Init
      # and BEFORE Terraform Validate.
      #
      # It imports the existing EKS cluster and then verifies
      # that the resource actually exists in Terraform state.
      # ============================================================
      - name: Synchronize Existing EKS Cluster
        working-directory: infra/terraform
        run: |
          set -e

          CLUSTER_NAME="secure-cloud-cluster"
          REGION="us-east-1"
          TF_RESOURCE='module.eks.aws_eks_cluster.this[0]'

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING EKS CLUSTER"
          echo "=========================================="

          echo "Checking AWS for EKS cluster..."

          if aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$REGION" >/dev/null 2>&1; then

            echo "Existing EKS cluster found:"
            echo "$CLUSTER_NAME"

          else

            echo "EKS cluster does not exist in AWS."
            echo "Terraform will create the cluster."
            exit 0

          fi


          echo ""
          echo "=========================================="
          echo "CHECKING TERRAFORM STATE"
          echo "=========================================="

          echo "Checking S3-backed Terraform state..."

          terraform state pull >/dev/null

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -Fqx "$TF_RESOURCE"; then

            echo "EKS cluster is already managed by Terraform."
            echo "$TF_RESOURCE"

          else

            echo "EKS cluster is NOT in Terraform state."
            echo ""
            echo "Importing existing EKS cluster..."
            echo ""

            terraform import \
              -input=false \
              "$TF_RESOURCE" \
              "$CLUSTER_NAME"

            echo ""
            echo "=========================================="
            echo "VERIFYING EKS IMPORT"
            echo "=========================================="

            if terraform state show "$TF_RESOURCE" >/dev/null 2>&1; then

              echo "SUCCESS: EKS cluster was imported."
              echo "$TF_RESOURCE"

            else

              echo "ERROR: Terraform import completed but"
              echo "the EKS cluster cannot be found in state."

              exit 1

            fi

          fi


          echo ""
          echo "=========================================="
          echo "FINAL TERRAFORM STATE VERIFICATION"
          echo "=========================================="

          FINAL_STATE=$(terraform state list 2>/dev/null || true)

          if echo "$FINAL_STATE" | grep -Fqx "$TF_RESOURCE"; then

            echo "SUCCESS: EKS cluster is present in Terraform state."
            echo ""
            echo "Terraform resource:"
            echo "$TF_RESOURCE"

          else

            echo "ERROR: EKS cluster is NOT present in Terraform state."
            echo ""
            echo "Terraform will NOT continue to plan/apply."
            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "EKS STATE DETAILS"
          echo "=========================================="

          terraform state show "$TF_RESOURCE"

          echo ""
          echo "=========================================="
          echo "EKS SYNCHRONIZATION COMPLETE"
          echo "=========================================="


      # ============================================================
      # TERRAFORM VALIDATE
      # ============================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate


      # ============================================================
      # TERRAFORM PLAN
      # ============================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # ============================================================
      # TERRAFORM APPLY
      # ============================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ============================================================
      # DEPLOYMENT FAILURE NOTIFICATION
      # ============================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
