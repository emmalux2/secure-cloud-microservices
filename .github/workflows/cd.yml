name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # Verify AWS authentication
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      # Verify Boto3 credentials
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY

      # Check Terraform S3 backend bucket
      - name: Check Terraform State Bucket
        run: |
          echo "=========================================="
          echo "CHECKING TERRAFORM STATE BUCKET"
          echo "=========================================="

          BUCKET="secure-cloud-microservices-tfstate-797776210271"
          REGION="us-east-1"

          if aws s3api head-bucket \
            --bucket "$BUCKET" \
            --region "$REGION"; then

            echo "Terraform state bucket exists:"
            echo "$BUCKET"

          else

            echo "ERROR: Terraform state bucket does not exist:"
            echo "$BUCKET"
            echo ""
            echo "Create this S3 bucket before Terraform can initialize."
            exit 1

          fi

      # Terraform initialization
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure

      # Validate Terraform configuration
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate

      # Generate Terraform plan
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # Apply Terraform infrastructure
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # Send email if deployment fails
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
