name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3


      # ============================================================
      # AWS OIDC AUTHENTICATION
      # ============================================================

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true


      # ============================================================
      # VERIFY AWS
      # ============================================================

      - name: Verify AWS Connection
        run: |
          echo "=========================================="
          echo "VERIFYING AWS CONNECTION"
          echo "=========================================="

          aws sts get-caller-identity


      # ============================================================
      # VERIFY BOTO3
      # ============================================================

      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY


      # ============================================================
      # CHECK TERRAFORM STATE BUCKET
      # ============================================================

      - name: Check Terraform State Bucket
        run: |
          echo "=========================================="
          echo "CHECKING TERRAFORM STATE BUCKET"
          echo "=========================================="

          BUCKET="secure-cloud-microservices-tfstate-797776210271"
          REGION="us-east-1"

          if aws s3api head-bucket \
            --bucket "$BUCKET" \
            --region "$REGION"; then

            echo "Terraform state bucket exists:"
            echo "$BUCKET"

          else

            echo "ERROR: Terraform state bucket does not exist:"
            echo "$BUCKET"
            echo ""
            echo "Create the bucket before Terraform can initialize."

            exit 1
          fi


      # ============================================================
      # TERRAFORM INIT
      # ============================================================

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure


      # ============================================================
      # SYNCHRONIZE WAF
      # ============================================================

      - name: Synchronize Existing WAF
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING WAF"
          echo "=========================================="

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -q '^aws_wafv2_web_acl\.main$'; then

            echo "WAF is already managed by Terraform."

          else

            WAF_ARN=$(aws wafv2 list-web-acls \
              --scope REGIONAL \
              --region us-east-1 \
              --query "WebACLs[?Name=='main-waf'].ARN | [0]" \
              --output text)

            if [ -z "$WAF_ARN" ] || [ "$WAF_ARN" = "None" ]; then

              echo "WAF main-waf does not exist."
              echo "Terraform will create it."

            else

              echo "Existing WAF found:"
              echo "$WAF_ARN"

              terraform import \
                -input=false \
                aws_wafv2_web_acl.main \
                "$WAF_ARN"

              echo "WAF successfully imported."

            fi
          fi


      # ============================================================
      # SYNCHRONIZE WAF LOG GROUP
      # ============================================================

      - name: Synchronize WAF Log Group
        working-directory: infra/terraform
        run: |
          set -e

          ```yaml
      # ============================================================
      # SYNCHRONIZE EXISTING WAF
      # ============================================================

      - name: Synchronize Existing WAF
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EXISTING WAF"
          echo "=========================================="

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -q '^aws_wafv2_web_acl\.main$'; then

            echo "WAF is already managed by Terraform."

          else

            WAF_ID=$(aws wafv2 list-web-acls \
              --scope REGIONAL \
              --region us-east-1 \
              --query "WebACLs[?Name=='main-waf'].Id | [0]" \
              --output text)

            if [ -z "$WAF_ID" ] || [ "$WAF_ID" = "None" ]; then

              echo "WAF main-waf does not exist."
              echo "Terraform will create it."

            else

              echo "Existing WAF ID found:"
              echo "$WAF_ID"

              echo "Importing WAF using:"
              echo "$WAF_ID/main-waf/REGIONAL"

              terraform import \
                -input=false \
                aws_wafv2_web_acl.main \
                "$WAF_ID/main-waf/REGIONAL"

              echo "WAF successfully imported."

            fi
          fi



      # ============================================================
      # SYNCHRONIZE EKS CLUSTER LOG GROUP
      # ============================================================

      - name: Synchronize EKS Log Group
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EKS LOG GROUP"
          echo "=========================================="

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          if echo "$STATE_LIST" | grep -q '^module\.eks\.aws_cloudwatch_log_group\.this\[0\]$'; then

            echo "EKS log group is already managed by Terraform."

          else

            EKS_LOG_GROUP="/aws/eks/secure-cloud-cluster/cluster"

            if aws logs describe-log-groups \
              --log-group-name-prefix "$EKS_LOG_GROUP" \
              --region us-east-1 \
              --query "logGroups[?logGroupName=='$EKS_LOG_GROUP'].logGroupName | [0]" \
              --output text | grep -q "$EKS_LOG_GROUP"; then

              echo "Existing EKS log group found:"
              echo "$EKS_LOG_GROUP"

              terraform import \
                -input=false \
                'module.eks.aws_cloudwatch_log_group.this[0]' \
                "$EKS_LOG_GROUP"

              echo "EKS log group successfully imported."

            else

              echo "EKS log group does not exist."
              echo "Terraform will create it."

            fi
          fi


      # ============================================================
      # SYNCHRONIZE EKS KMS ALIAS
      # ============================================================

      - name: Synchronize EKS KMS Alias
        working-directory: infra/terraform
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONIZING EKS KMS ALIAS"
          echo "=========================================="

          STATE_LIST=$(terraform state list 2>/dev/null || true)

          KMS_ALIAS_ADDRESS='module.eks.module.kms.aws_kms_alias.this["cluster"]'

          if echo "$STATE_LIST" | grep -Fq "$KMS_ALIAS_ADDRESS"; then

            echo "EKS KMS alias is already managed by Terraform."

          else

            KMS_ALIAS="alias/eks/secure-cloud-cluster"

            if aws kms list-aliases \
              --region us-east-1 \
              --query "Aliases[?AliasName=='$KMS_ALIAS'].AliasName | [0]" \
              --output text | grep -q "$KMS_ALIAS"; then

              echo "Existing KMS alias found:"
              echo "$KMS_ALIAS"

              terraform import \
                -input=false \
                "$KMS_ALIAS_ADDRESS" \
                "$KMS_ALIAS"

              echo "KMS alias successfully imported."

            else

              echo "KMS alias does not exist."
              echo "Terraform will create it."

            fi
          fi


      # ============================================================
      # FINAL TERRAFORM STATE
      # ============================================================

      - name: Final Terraform State
        working-directory: infra/terraform
        run: |
          echo "=========================================="
          echo "FINAL TERRAFORM STATE"
          echo "=========================================="

          terraform state list || true


      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate


      # ============================================================
      # TERRAFORM PLAN
      # ============================================================

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # ============================================================
      # TERRAFORM APPLY
      # ============================================================

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ============================================================
      # DEPLOYMENT FAILURE EMAIL
      # ============================================================

      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
