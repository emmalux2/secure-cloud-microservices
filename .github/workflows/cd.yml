name: Continuous Delivery

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================================
      # TERRAFORM
      # ==========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ==========================================================
      # PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # ==========================================================
      # AWS OIDC
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # ==========================================================
      # VERIFY AWS
      # ==========================================================
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================
      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init \
            -input=false \
            -reconfigure

      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform validate

      # ==========================================================
      # CHECK SECRET IN AWS
      # ==========================================================
      - name: Check Existing JWT Secret
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Checking AWS Secrets Manager..."

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "secure-cloud/jwt-access-secret" \
            --query "ARN" \
            --output text)

          echo "Existing secret:"
          echo "$SECRET_ARN"

      # ==========================================================
      # CHECK TERRAFORM STATE
      # ==========================================================
      - name: Check Terraform State
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Checking Terraform state..."

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then
            echo "JWT secret already exists in Terraform state."
          else
            echo "JWT secret is NOT in Terraform state."
          fi

      # ==========================================================
      # IMPORT EXISTING SECRET IF NECESSARY
      # ==========================================================
      - name: Import Existing JWT Secret
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Checking whether JWT secret requires import..."

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then

            echo "JWT secret is already managed by Terraform."
            echo "No import required."

          else

            echo "JWT secret is NOT managed by Terraform."
            echo "Importing existing AWS secret..."

            SECRET_ARN=$(aws secretsmanager describe-secret \
              --secret-id "secure-cloud/jwt-access-secret" \
              --query "ARN" \
              --output text)

            terraform import \
              -input=false \
              aws_secretsmanager_secret.jwt_access \
              "$SECRET_ARN"

          fi

      # ==========================================================
      # VERIFY IMPORT
      # ==========================================================
      - name: Verify JWT Secret Terraform State
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Verifying Terraform state..."

          terraform state list

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then
            echo "SUCCESS: JWT secret is managed by Terraform."
          else
            echo "ERROR: JWT secret is NOT in Terraform state."
            exit 1
          fi

      # ==========================================================
      # TERRAFORM PLAN
      # ==========================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # ==========================================================
      # TERRAFORM APPLY
      # ==========================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ==========================================================
      # FAILURE NOTIFICATION
      # ==========================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
