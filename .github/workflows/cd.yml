name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # ---------------------------------------------------------
      # AWS OIDC AUTHENTICATION
      # ---------------------------------------------------------
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # ---------------------------------------------------------
      # VERIFY AWS
      # ---------------------------------------------------------
      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # TERRAFORM INIT
      # ---------------------------------------------------------
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false -reconfigure

      # ---------------------------------------------------------
      # IMPORT EXISTING JWT SECRET
      # ---------------------------------------------------------
      - name: Import Existing JWT Secret
        working-directory: infra/terraform
        shell: bash
        run: |
          echo "Checking AWS Secrets Manager..."

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "secure-cloud/jwt-access-secret" \
            --query "ARN" \
            --output text)

          echo "Secret ARN:"
          echo "$SECRET_ARN"

          echo ""
          echo "Checking Terraform state..."

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then
            echo "Secret is already in Terraform state."
          else
            echo "Secret is NOT in Terraform state."
            echo "Importing existing secret..."

            terraform import \
              -input=false \
              "aws_secretsmanager_secret.jwt_access" \
              "$SECRET_ARN"
          fi

          echo ""
          echo "Terraform state after import:"
          terraform state list

          echo ""
          echo "Checking imported secret:"
          terraform state show aws_secretsmanager_secret.jwt_access

      # ---------------------------------------------------------
      # VALIDATE
      # ---------------------------------------------------------
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate

      # ---------------------------------------------------------
      # PLAN
      # ---------------------------------------------------------
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          rm -f tfplan

          terraform plan \
            -input=false \
            -out=tfplan

      # ---------------------------------------------------------
      # APPLY
      # ---------------------------------------------------------
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ---------------------------------------------------------
      # FAILURE NOTIFICATION
      # ---------------------------------------------------------
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"

