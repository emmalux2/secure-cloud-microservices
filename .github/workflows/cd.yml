name: Continuous Delivery

on:
  push:
    branches: [ "main" ]

# Set environment variables globally across all jobs and steps
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

# Global permissions required for OIDC token minting
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Verify AWS Connection
        run: |
          aws sts get-caller-identity

      - name: Deploy Microservices
        run: |
          echo "Executing Continuous Delivery tasks..."
          # Insert your microservices deployment steps here

      - name: Notify on Deploy Failure
        if: failure()
        env:
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py --event "DEPLOY_FAILURE" --repo "${{ github.repository }}" --run "${{ github.run_id }}"