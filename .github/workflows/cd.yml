name: "Terraform Infrastructure Management"

on:
  push:
    branches:
      - main
  # Enables manual execution from the GitHub Actions UI tab
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform Action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest

    # Set working-directory if your .tf files are inside a subfolder (e.g., ./terraform)
    # defaults:
    #   run:
    #     working-directory: ./terraform

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change to your target region if different

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Initialize Terraform
        run: terraform init

      # STEP 1: Pre-cleanup step to unlock stuck node groups prior to destruction
      - name: Pre-cleanup Attached Node Groups (On Destroy Only)
        if: ${{ inputs.action == 'destroy' }}
        run: |
          echo "Checking for attached EKS node groups..."
          NODEGROUPS=$(aws eks list-nodegroups --cluster-name secure-cloud-cluster --query "nodegroups[]" --output text 2>/dev/null || true)
          
          if [ -n "$NODEGROUPS" ]; then
            for ng in $NODEGROUPS; do
              echo "Deleting nodegroup: $ng"
              aws eks delete-nodegroup --cluster-name secure-cloud-cluster --nodegroup-name $ng
              echo "Waiting for nodegroup $ng to finish deletion..."
              aws eks wait nodegroup-deleted --cluster-name secure-cloud-cluster --nodegroup-name $ng
            done
          else
            echo "No active node groups found."
          fi
        continue-on-error: true

      # STEP 2: Main Terraform Execution Logic
      - name: Execute Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve

      - name: Execute Terraform Apply
        if: ${{ github.event_name == 'push' && inputs.action != 'destroy' }}
        run: terraform apply -auto-approve