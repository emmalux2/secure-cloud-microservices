name: Continuous Delivery

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      # ============================================================
      # AWS OIDC AUTHENTICATION
      # ============================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::797776210271:role/GitHubActionsDeployRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # ============================================================
      # VERIFY AWS
      # ============================================================
      - name: Verify AWS Connection
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # ============================================================
      # VERIFY BOTO3
      # ============================================================
      - name: Verify Boto3 Credentials
        run: |
          python - <<'PY'
          import boto3

          session = boto3.Session()
          credentials = session.get_credentials()

          if credentials is None:
              raise RuntimeError("Boto3 cannot find AWS credentials")

          print("Boto3 credentials detected")
          print(f"Credential method: {credentials.method}")
          print(f"AWS region: {session.region_name}")
          PY

      # ============================================================
      # TERRAFORM INIT
      # ============================================================
      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure

      # ============================================================
      # SHOW TERRAFORM BACKEND
      # ============================================================
      - name: Verify Terraform State
        working-directory: infra/terraform
        run: |
          echo "=========================================="
          echo "TERRAFORM STATE BEFORE SECRET CHECK"
          echo "=========================================="

          terraform state list || true

          echo ""
          echo "=========================================="
          echo "CHECKING JWT SECRET IN TERRAFORM STATE"
          echo "=========================================="

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then
            echo "JWT secret IS already in Terraform state."
          else
            echo "JWT secret is NOT currently in Terraform state."
          fi

      # ============================================================
      # ENSURE AWS SECRET EXISTS IN TERRAFORM STATE
      # ============================================================
      - name: Ensure JWT Secret Is Managed By Terraform
        working-directory: infra/terraform
        shell: bash
        run: |
          set -e

          SECRET_NAME="secure-cloud/jwt-access-secret"

          echo "=========================================="
          echo "CHECKING AWS SECRETS MANAGER"
          echo "=========================================="

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query "ARN" \
            --output text 2>/dev/null || true)

          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then
            echo "Secret does NOT exist in AWS."
            echo "Terraform will create the secret."
          else
            echo "Secret exists in AWS:"
            echo "$SECRET_ARN"

            echo ""
            echo "=========================================="
            echo "CHECKING TERRAFORM STATE"
            echo "=========================================="

            if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then

              echo "Secret is already managed by Terraform."
              echo "No import required."

            else

              echo "Secret is NOT managed by Terraform."
              echo "Importing existing AWS secret..."

              terraform import \
                -input=false \
                aws_secretsmanager_secret.jwt_access \
                "$SECRET_ARN"

              echo ""
              echo "Import completed."

            fi
          fi

      # ============================================================
      # VERIFY SECRET IS NOW IN STATE
      # ============================================================
      - name: Verify JWT Secret State
        working-directory: infra/terraform
        run: |
          echo "=========================================="
          echo "FINAL TERRAFORM STATE CHECK"
          echo "=========================================="

          terraform state list

          echo ""
          echo "Checking specifically for JWT secret..."

          if terraform state list | grep -Fxq "aws_secretsmanager_secret.jwt_access"; then
            echo ""
            echo "SUCCESS:"
            echo "aws_secretsmanager_secret.jwt_access is managed by Terraform."
          else
            echo ""
            echo "ERROR:"
            echo "aws_secretsmanager_secret.jwt_access is NOT in Terraform state."
            exit 1
          fi

      # ============================================================
      # VALIDATE
      # ============================================================
      - name: Terraform Validate
        working-directory: infra/terraform
        run: |
          terraform validate

      # ============================================================
      # PLAN
      # ============================================================
      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # ============================================================
      # APPLY
      # ============================================================
      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ============================================================
      # FAILURE NOTIFICATION
      # ============================================================
      - name: Notify on Deploy Failure
        if: ${{ failure() }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          SES_SENDER: ${{ secrets.SES_SENDER }}
          SES_RECIPIENT: ${{ secrets.SES_RECIPIENT }}
        run: |
          python alerts/notify.py \
            --event "DEPLOY_FAILURE" \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}"
