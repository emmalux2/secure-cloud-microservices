apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: securecloud-services
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - securecloud
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth-service
          - resource-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s