{{- $fullname := include "securecloud.fullname" . -}}
{{- $authName := printf "%s-auth" $fullname -}}
{{- $resourceName := printf "%s-resource" $fullname -}}
{{- $postgresName := printf "%s-postgres" $fullname -}}
{{- $authSecret := (lookup "v1" "Secret" .Release.Namespace $authName) | default dict -}}
{{- $authData := (get $authSecret "data") | default dict -}}
{{- $resourceSecret := (lookup "v1" "Secret" .Release.Namespace $resourceName) | default dict -}}
{{- $resourceData := (get $resourceSecret "data") | default dict -}}
{{- $postgresSecret := (lookup "v1" "Secret" .Release.Namespace $postgresName) | default dict -}}
{{- $postgresData := (get $postgresSecret "data") | default dict -}}
{{- $jwtAccess := (get $authData "JWT_ACCESS_SECRET") | default (randAlphaNum 64 | b64enc) -}}
{{- $jwtRefresh := (get $authData "JWT_REFRESH_SECRET") | default (randAlphaNum 64 | b64enc) -}}
{{- $resourceJwtAccess := (get $resourceData "JWT_ACCESS_SECRET") | default $jwtAccess -}}
{{- $postgresPassword := (get $postgresData "POSTGRES_PASSWORD") | default (randAlphaNum 32 | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authName }}
type: Opaque
data:
  JWT_ACCESS_SECRET: {{ $jwtAccess | quote }}
  JWT_REFRESH_SECRET: {{ $jwtRefresh | quote }}
  DATABASE_URL: {{ printf "postgresql://securecloud:%s@%s-postgres:5432/securecloud" ($postgresPassword | b64dec) $fullname | b64enc | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" $fullname | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $resourceName }}
type: Opaque
data:
  JWT_ACCESS_SECRET: {{ $resourceJwtAccess | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" $fullname | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresName }}
type: Opaque
data:
  POSTGRES_DB: {{ "securecloud" | b64enc | quote }}
  POSTGRES_USER: {{ "securecloud" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}