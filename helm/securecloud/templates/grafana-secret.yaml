apiVersion: v1
kind: Secret
metadata:
  name: securecloud-grafana-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  admin-user: {{ default "admin" .Values.grafana.adminUser | b64enc }}
  admin-password: {{ default "secure-grafana-password-123" .Values.grafana.adminPassword | b64enc }}