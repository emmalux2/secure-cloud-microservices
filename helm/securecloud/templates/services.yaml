apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: {{ .Values.authService.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  labels:
    app: resource-service
spec:
  type: ClusterIP
  selector:
    app: resource-service
  ports:
    - name: http
      port: {{ .Values.resourceService.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "securecloud.fullname" . }}-postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "securecloud.fullname" . }}-redis
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis